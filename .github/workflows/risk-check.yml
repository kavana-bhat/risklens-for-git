name: Change Risk Check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: needed for merge-base and blame

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Analyse pull request
        run: >
          python ci_comment.py --repo . --base origin/${{ github.base_ref }}
          --head HEAD --out risk-comment.md

      - name: Post / update comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file risk-comment.md --edit-last \
          || gh pr comment ${{ github.event.pull_request.number }} \
            --body-file risk-comment.md
